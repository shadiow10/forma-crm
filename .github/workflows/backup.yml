name: Backup

# Weekly database dump AND a copy of the student documents bucket, kept as encrypted artifacts
# for 90 days.
#
# Artifacts follow the repository's visibility, so while this repository is public anyone can
# download them. Neither file ever leaves this job unencrypted: between them they hold every
# student, phone number, address, payment, password hash, identity card and medical certificate.
#
# An attacker who downloads an artifact can grind the passphrase offline, forever, unobserved.
# GPG's default key-derivation is far too fast for that, so both files use the strongest
# iteration count GPG allows (--s2k-count 65011712, roughly 65 million rounds of SHA-512).
# That turns each guess from microseconds into something too slow to be worth a try.
# It does NOT rescue a guessable passphrase: BACKUP_PASSPHRASE must be six or more random
# words, generated, never chosen by hand.
#
# Decrypt either file with the same passphrase:
#   gpg --decrypt backup-YYYY-MM-DD.sql.gpg    > backup.sql
#   gpg --decrypt documents-YYYY-MM-DD.tar.gz.gpg > documents.tar.gz
#
# Four repository secrets are required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL              postgresql://postgres.<ref>:<password>@aws-N-<region>.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE            a long random passphrase, kept in your password manager
#   SUPABASE_URL                 https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    Project Settings -> API. Bypasses RLS, so it never goes anywhere else.
#
# Secrets are not exposed to pull requests from forks, and this workflow runs only on a schedule
# or by hand, so a stranger's PR can never reach them.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the database and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" && test -n "$PASSPHRASE"   # fail loudly rather than upload an empty file
          name="backup-$(date -u +%F)"
          # pg_dump must be at least the server's version, so use the matching image rather than the runner's client.
          docker run --rm postgres:17-alpine pg_dump "$DB_URL" --clean --if-exists --no-owner > "$name.sql"
          test -s "$name.sql"                          # a zero-byte dump is a failed backup
          grep -q "PostgreSQL database dump complete" "$name.sql"
          gpg --batch --symmetric --cipher-algo AES256 \
              --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
              --passphrase "$PASSPHRASE" -o "$name.sql.gpg" "$name.sql"
          rm "$name.sql"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.sql.gpg"

      # The database dump does not contain the files themselves, only the rows pointing at them.
      # Identity cards and medical certificates are the least replaceable thing here: a phone
      # number can be typed again, a scanned document has to be collected from the student again.
      - name: Copy the documents bucket and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SERVICE_KEY"
          name="documents-$(date -u +%F)"

          # The storage catalogue is the authoritative list, and we already hold a database
          # connection — more reliable than walking the storage API's folder listing.
          docker run --rm -i postgres:17-alpine psql "$DB_URL" -Atc \
            "select name from storage.objects where bucket_id = 'student-documents' order by name" > paths.txt
          expected=$(grep -c . paths.txt || true)
          echo "$expected object(s) in the bucket"

          mkdir -p docs
          # Upload paths are built as <school>/<student>/<timestamp>-<sanitised name>, and the
          # client strips everything outside [A-Za-z0-9._-], so no path here needs URL escaping.
          while IFS= read -r object; do
            [ -z "$object" ] && continue
            mkdir -p "docs/$(dirname "$object")"
            curl -fsSL --retry 3 -H "Authorization: Bearer $SERVICE_KEY" \
              "$SUPABASE_URL/storage/v1/object/student-documents/$object" -o "docs/$object"
          done < paths.txt

          got=$(find docs -type f | wc -l)
          test "$got" -eq "$expected"   # a partial copy is a failed backup, not a smaller one
          echo "fetched $got/$expected"

          tar -czf "$name.tar.gz" -C docs .
          gpg --batch --symmetric --cipher-algo AES256 \
              --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
              --passphrase "$PASSPHRASE" -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf docs "$name.tar.gz" paths.txt
          echo "DOCUMENTS_NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: |
            ${{ env.BACKUP_NAME }}.sql.gpg
            ${{ env.DOCUMENTS_NAME }}.tar.gz.gpg
          retention-days: 90
